name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # The plugin manifest version, the marketplace listing version, and the
      # @tesseron/mcp / @tesseron/docs-mcp version pins inside plugin/.mcp.json
      # must all match @tesseron/mcp's package.json version. Run after tests so
      # the cheap fail signals (typecheck, lint) surface first.
      - name: Verify plugin manifests in sync with @tesseron/mcp
        run: pnpm sync-plugin-version --check

      # The conformance fixtures are consumed by out-of-repo SDK ports, so a
      # malformed one shows up as a failing implementation in someone else's
      # repo rather than as a failure here.
      - name: Validate conformance fixtures
        run: pnpm conformance:validate

      - name: Build conformance runner and reference host
        run: pnpm -r --filter "@tesseron/*" --filter "!@tesseron/docs" build

      - name: Run conformance suite
        run: pnpm conformance:run

      - name: Docs change carries a docs-mcp changeset
        if: github.event_name == 'pull_request'
        run: pnpm check-docs-changeset

  rust:
    name: Rust SDK
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      # --all, because without it cargo fmt reaches the root package only and
      # the conformance host goes unchecked.
      - name: Format
        run: cargo fmt --manifest-path sdks/rust/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path sdks/rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path sdks/rust/Cargo.toml --workspace

      - name: Build the conformance host
        run: cargo build --manifest-path sdks/rust/Cargo.toml --workspace

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # SQ-13 publishes @tesseron/conformance. Once 1.2.0 is on npm, delete the
      # install and this build and run `npx @tesseron/conformance@1.2.0` in the
      # steps below, so the Rust host is checked against the published corpus
      # instead of against whatever happens to be in the tree.
      - name: Build the conformance runner
        run: pnpm -r --filter @tesseron/conformance build

      # The helper adds uds on Windows and owns the unsupported list, which
      # the runner cross-checks against the four hello capability flags: a
      # capability declared true in the SDK and named here fails the run.
      # Host-minted claims are the only thing the Rust host leaves out.
      - name: Run the conformance suite
        run: pnpm conformance:run:rust

  python:
    name: Python SDK
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the locked environment
        run: uv sync --locked --directory sdks/python

      - name: Lint
        run: uv run --locked --directory sdks/python ruff check .

      - name: Format
        run: uv run --locked --directory sdks/python ruff format --check .

      # src and tests, because a test importing conformance_host is what pulls the
      # fixture adapter into the check as well.
      - name: Typecheck
        run: uv run --locked --directory sdks/python mypy --strict src tests

      - name: Test
        run: uv run --locked --directory sdks/python pytest

      - name: Build the wheel
        run: uv build --directory sdks/python

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # SQ-13 publishes @tesseron/conformance. Once 1.2.0 is on npm, delete this
      # build and run `npx @tesseron/conformance@1.2.0` below, so the Python host
      # is checked against the published corpus instead of the tree.
      - name: Build the conformance runner
        run: pnpm -r --filter @tesseron/conformance build

      # The helper adds uds on Windows and owns the unsupported list, which the
      # runner cross-checks against the four hello capability flags: a capability
      # declared true in the SDK and named here fails the run. This host speaks
      # WebSocket only and takes gateway-minted claims only.
      - name: Run the conformance suite
        run: pnpm conformance:run:python

name: C++ SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Clang
            os: ubuntu-latest
            compiler: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            conformance_host: build/conformance-host/tesseron-conformance-host
          - name: Windows MSVC
            os: windows-latest
            compiler: ""
            conformance_host: build/conformance-host/tesseron-conformance-host.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cpp-deps-${{ runner.os }}-${{ hashFiles('cmake/TesseronDependencies.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DTESSERON_BUILD_TESTS=ON
          -DTESSERON_BUILD_CONFORMANCE_HOST=ON
          -DTESSERON_BUILD_EXAMPLES=ON
          ${{ matrix.compiler }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runner is published from the hub and pinned to the protocol version.
      - name: Run conformance suite
        env:
          TESSERON_CONFORMANCE_UNSUPPORTED: host-minted-claim,uds
        run: npx -y @tesseron/conformance@1.2.0 --host ${{ matrix.conformance_host }}

      # examples/validate-e2e.mjs needs the hub gateway, so standalone CI omits it.

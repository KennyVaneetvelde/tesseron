name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Python SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format
        run: uv run --locked ruff format --check .

      - name: Typecheck
        run: uv run --locked mypy --strict src tests

      - name: Test
        run: uv run --locked pytest

      - name: Build the wheel
        run: uv build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runner is published from the hub and pinned to the protocol version.
      - name: Run the conformance suite
        run: npx -y @tesseron/conformance@1.2.0 --host "uv run --locked python -m conformance_host" --unsupported host-minted-claim,uds

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Rust SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude tauri-todo --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude tauri-todo

      - name: Build the conformance host
        run: cargo build --workspace --exclude tauri-todo

      - name: Check the Tauri example
        if: runner.os == 'Windows'
        run: cargo check -p tauri-todo

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The runner is published from the hub and pinned to the protocol version.
      - name: Run the conformance suite
        if: runner.os != 'Windows'
        env:
          TESSERON_CONFORMANCE_UNSUPPORTED: host-minted-claim,uds
        run: npx -y @tesseron/conformance@1.2.0 --host ./target/debug/tesseron-conformance-host

      - name: Run the conformance suite on Windows
        if: runner.os == 'Windows'
        env:
          TESSERON_CONFORMANCE_UNSUPPORTED: host-minted-claim,uds
        run: npx -y @tesseron/conformance@1.2.0 --host .\target\debug\tesseron-conformance-host.exe

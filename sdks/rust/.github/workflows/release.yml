name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude tauri-todo --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude tauri-todo

      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish
        run: cargo publish -p tesseron --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
